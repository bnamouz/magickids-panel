name: Intake workflow checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:intake
      - run: node --test scripts/test-dashboard.mjs
      - run: node scripts/test-case-actions.mjs
      - run: node --test scripts/test-calendar-consistency.mjs scripts/test-moxo-calendar.mjs
      - run: npm run test:booking
      - run: node --test scripts/test-doctor-requests.mjs
      - run: npm run test:sarah-moxo
      - run: node --test scripts/test-appointment-confirmations.mjs scripts/test-clinical-notes.mjs
